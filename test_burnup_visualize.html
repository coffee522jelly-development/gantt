<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<canvas id="myChart" width="400" height="400"></canvas>
<script>
const planData = [
    0, 0.2, 0.5, 0.7,   1, 1.2,
  1.4, 1.7, 1.9, 2.1, 2.4, 2.6,
  2.9, 3.1, 3.3, 3.6, 3.8,   4,
  4.3, 4.5, 4.8,   5
];
const labels = planData.map((_, i) => i);
new Chart(document.getElementById('myChart'), {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'Plan',
            data: planData,
            borderColor: 'gray',
            fill: false
        }]
    }
});
</script>
</body>
</html>
