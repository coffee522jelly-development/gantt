<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt & Burn-up Chart App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#ffffff] dark:bg-[#191919] text-[#37352f] dark:text-[#EBEBEB] h-screen flex flex-col font-sans transition-colors duration-200">
    <header class="bg-transparent border-b border-gray-200 dark:border-gray-800 p-3 flex flex-wrap justify-between items-center">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-bold">プロジェクト管理</h1>
            <div class="px-2 py-1 rounded text-xs font-semibold bg-gray-100 dark:bg-[#2F2F2F] border border-gray-200 dark:border-gray-700">
                進捗: <span id="project-progress">0%</span>
            </div>
        </div>
        <div id="project-settings" class="flex gap-4 items-center mt-2 sm:mt-0 text-sm">
            <div class="flex items-center border border-gray-200 dark:border-gray-700 rounded overflow-hidden">
                <button id="theme-toggle-btn" class="p-1 hover:bg-gray-100 dark:hover:bg-[#2F2F2F] transition-colors border-r border-gray-200 dark:border-gray-700" title="テーマ切り替え">
                    🌓
                </button>
                <input type="color" id="accent-color-picker" value="#3b82f6" class="w-8 h-8 p-0 border-0 bg-transparent cursor-pointer" title="アクセントカラー設定">
            </div>
            <div class="flex items-center gap-2">
                <label for="project-start" class="text-gray-500 dark:text-gray-400">開始:</label>
                <input type="date" id="project-start" class="bg-transparent border border-gray-200 dark:border-gray-700 rounded p-1 dark:text-[#EBEBEB] dark:[color-scheme:dark]">
            </div>
            <div class="flex items-center gap-2">
                <label for="project-end" class="text-gray-500 dark:text-gray-400">終了:</label>
                <input type="date" id="project-end" class="bg-transparent border border-gray-200 dark:border-gray-700 rounded p-1 dark:text-[#EBEBEB] dark:[color-scheme:dark]">
            </div>
            <button id="open-holiday-modal-btn" class="px-2 py-1 rounded border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-[#2F2F2F] transition-colors">
                休日設定
            </button>
        </div>
    </header>

    <nav class="bg-transparent border-b border-gray-200 dark:border-gray-800">
        <ul class="flex px-4 pt-2">
            <li class="mr-1">
                <a class="inline-block py-1 px-3 text-sm font-medium border-b-2 border-black dark:border-white text-black dark:text-white cursor-pointer transition-colors" id="tab-gantt">ガントチャート</a>
            </li>
            <li class="mr-1">
                <a class="inline-block py-1 px-3 text-sm font-medium border-b-2 border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 cursor-pointer transition-colors" id="tab-burnup">バーンアップチャート</a>
            </li>
        </ul>
    </nav>

    <main class="flex-1 overflow-hidden relative bg-gray-50 dark:bg-[#191919]">
        <div id="view-gantt" class="h-full flex flex-col p-4">
            <div class="mb-4 flex gap-2">
                <input type="text" id="new-task-name" placeholder="新しいタスク名" class="bg-white dark:bg-[#202020] border border-gray-200 dark:border-gray-700 p-1.5 px-3 rounded w-64 text-sm focus:outline-none focus:border-gray-400 dark:focus:border-gray-500 transition-colors">
                <button id="add-task-btn" class="bg-white dark:bg-[#2F2F2F] hover:bg-gray-100 dark:hover:bg-[#3F3F3F] text-sm font-medium py-1.5 px-4 rounded border border-gray-200 dark:border-gray-700 transition-colors">タスク追加</button>
            </div>
            <div class="flex flex-1 bg-white dark:bg-[#202020] rounded border border-gray-200 dark:border-gray-700 overflow-hidden" style="min-height: 0;">
                <div class="w-1/4 border-r border-gray-200 dark:border-gray-700 flex flex-col overflow-y-auto">
                    <!-- Headers for task list to match gantt header height -->
                    <div class="h-8 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#2A2A2A] flex items-center px-4 font-medium text-xs text-gray-500 dark:text-gray-400 sticky top-0 z-10">タスク</div>
                    <div id="task-list-container" class="flex-1 pb-16 relative">
                        <!-- Task list items -->
                    </div>
                </div>
                <div class="w-3/4 overflow-x-auto overflow-y-auto relative bg-white dark:bg-[#202020]" id="gantt-scroll-area">
                    <div id="gantt-chart-container" class="gantt-grid pb-16">
                        <!-- Gantt chart cells and bars here -->
                    </div>
                </div>
            </div>
        </div>

        <div id="view-burnup" class="h-full hidden p-4 flex flex-col">
            <div class="mb-4 flex justify-end">
                <button id="export-chart-btn" class="bg-white dark:bg-[#2F2F2F] hover:bg-gray-100 dark:hover:bg-[#3F3F3F] text-sm font-medium py-1.5 px-4 rounded border border-gray-200 dark:border-gray-700 transition-colors">
                    PNGで保存
                </button>
            </div>
            <div class="bg-white dark:bg-[#202020] rounded border border-gray-200 dark:border-gray-700 p-4 flex-1 flex items-center justify-center min-h-0">
                <canvas id="burnupChart" class="w-full h-full"></canvas>
            </div>
        </div>
    </main>

    <!-- Task Detail Sliding Panel -->
    <div id="task-detail-panel" class="fixed right-0 top-0 h-full w-80 bg-white dark:bg-[#202020] border-l border-gray-200 dark:border-gray-700 shadow-2xl transform translate-x-full transition-transform duration-300 z-40 flex flex-col">
        <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-500 dark:text-gray-400">タスク詳細</h2>
            <button id="close-detail-panel-btn" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="p-4 flex-1 overflow-y-auto flex flex-col gap-6 text-sm">

            <div>
                <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">タスク名</label>
                <input type="text" id="detail-task-name" class="w-full bg-transparent border-b border-transparent hover:border-gray-200 dark:hover:border-gray-700 focus:border-blue-500 dark:focus:border-blue-500 focus:outline-none py-1 text-base font-medium transition-colors">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">期間</label>
                <div id="detail-task-dates" class="py-1 text-gray-700 dark:text-gray-300">
                    <!-- YYYY/MM/DD 〜 YYYY/MM/DD -->
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">タグ</label>
                <div id="detail-task-tags-list" class="flex flex-wrap gap-2 mb-2">
                    <!-- Tags will be injected here -->
                </div>
                <input type="text" id="detail-task-tag-input" placeholder="タグを追加 (Enter)" class="w-full bg-gray-50 dark:bg-[#191919] border border-gray-200 dark:border-gray-700 rounded p-1.5 focus:outline-none focus:border-gray-400 transition-colors">
            </div>

            <div class="flex-1 flex flex-col min-h-[150px]">
                <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">備考</label>
                <textarea id="detail-task-notes" class="flex-1 w-full bg-gray-50 dark:bg-[#191919] border border-gray-200 dark:border-gray-700 rounded p-2 focus:outline-none focus:border-gray-400 transition-colors resize-none" placeholder="タスクの備考を入力..."></textarea>
            </div>

        </div>
    </div>

    <!-- Custom Holiday Modal -->
    <div id="custom-holiday-modal" class="hidden fixed inset-0 bg-black/20 dark:bg-black/40 overflow-y-auto h-full w-full z-50 flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white dark:bg-[#202020] p-6 rounded shadow-lg w-full max-w-md border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold dark:text-[#EBEBEB]">カスタム休日設定</h2>
                <button id="close-holiday-modal-btn" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl font-bold">&times;</button>
            </div>

            <div class="mb-4 flex gap-2">
                <input type="date" id="new-custom-holiday" class="bg-transparent border border-gray-200 dark:border-gray-700 p-1.5 rounded flex-1 text-sm dark:[color-scheme:dark]">
                <button id="add-custom-holiday-btn" class="bg-white dark:bg-[#2F2F2F] hover:bg-gray-100 dark:hover:bg-[#3F3F3F] text-sm font-medium py-1.5 px-4 rounded border border-gray-200 dark:border-gray-700 transition-colors">追加</button>
            </div>

            <ul id="custom-holiday-list" class="max-h-60 overflow-y-auto border-t border-gray-200 dark:border-gray-700 divide-y divide-gray-100 dark:divide-gray-700/50">
                <!-- Custom holidays will be rendered here -->
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
