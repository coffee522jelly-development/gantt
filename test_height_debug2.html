<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  .gantt-grid { display: grid; position: relative; width: 400px; }
  .cell { border-right: 1px solid #eee; border-bottom: 1px solid #eee; }
  .bar { position: absolute; height: 32px; background: blue; color: white; }
</style>
</head>
<body>
  <div class="gantt-grid" id="grid">
    <!-- Header -->
    <div class="cell" style="grid-column: 1; grid-row: 1; height: 32px">1</div>

    <!-- Row 1 (120px) -->
    <div class="cell" style="grid-column: 1; grid-row: 2;"></div>

    <!-- Row 2 (92px) -->
    <div class="cell" style="grid-column: 1; grid-row: 3;"></div>

    <!-- Bars -->
    <div class="bar" style="grid-column: 1 / -1; grid-row: 2; margin-top: 8px; left: 0; width: 100px;">Task 1</div>
    <div class="bar" style="grid-column: 1 / -1; grid-row: 3; margin-top: 8px; left: 0; width: 100px;">Task 2</div>
  </div>
  <script>
    const grid = document.getElementById('grid');
    grid.style.gridTemplateRows = "32px 120px 92px";
    grid.style.gridTemplateColumns = "100px";
  </script>
</body>
</html>
